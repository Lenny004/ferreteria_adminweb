name: CI

on:
  push:
    branches: [main, desarrollo, develop]
  pull_request:
    branches: [main, desarrollo, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Tests
    # GitHub avisa que ubuntu-latest migra a Ubuntu 26 desde el 19-oct-2026; fijamos la imagen para explicitar el cambio.
    runs-on: ubuntu-24.04
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run type check
        run: npm run typecheck
      
      - name: Run tests with coverage
        run: npm test -- --ci --coverage

      # Dependencias de producción: bloqueante ante vulnerabilidades altas.
      - name: Audit dependencies (producción)
        run: npm audit --omit=dev --audit-level=high

      # Árbol completo (incluye herramientas de lint) informativo: GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3,
      # vía eslint-config-next -> fast-glob -> micromatch) no tiene versión corregida publicada.
      # Volver a hacerlo bloqueante cuando exista parche.
      - name: Audit dependencies (completo, informativo)
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api/v1' }}
