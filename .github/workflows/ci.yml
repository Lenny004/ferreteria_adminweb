name: CI

on:
  push:
    branches: [main, desarrollo, develop]
  pull_request:
    branches: [main, desarrollo, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Tests
    # GitHub avisa que ubuntu-latest migra a Ubuntu 26 desde el 19-oct-2026; fijamos la imagen para explicitar el cambio.
    runs-on: ubuntu-24.04
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint

      - name: Run CSS linter
        run: npm run lint:css

      - name: Audit CSS BEM and tokens
        run: python scripts/audit_css.py src/app/globals.css --mode global
      
      - name: Run type check
        run: npm run typecheck
      
      - name: Run tests with coverage
        run: npm test -- --ci --coverage

      # Auditoría completa (producción y desarrollo) con umbral alto. La única excepción
      # permitida está en audit-ci.jsonc (GHSA-vfj7-8cjw-p6xm, sin parche publicado).
      - name: Audit dependencies
        run: npm run audit:ci
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api/v1' }}
